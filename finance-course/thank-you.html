<!-- ===== Purchase conversion (fires once per visit) ===== -->
<script>
(function () {
  try {
    // Only fire once per browser session (guards against refresh double-counting)
    if (sessionStorage.getItem('purchase_tracked') === '1') return;

    // Use the real amount if SUMIT passes it in the URL; else fall back to launch price
    function getParam(names) {
      var q = new URLSearchParams(window.location.search);
      for (var i = 0; i < names.length; i++) {
        var v = q.get(names[i]);
        if (v && !isNaN(parseFloat(v))) return parseFloat(v);
      }
      return null;
    }
    var value = getParam(['total', 'amount', 'sum', 'price', 'paymentsum']) || 2990;

    if (window.fbq) fbq('track', 'Purchase', { value: value, currency: 'ILS' });
    if (window.gtag) gtag('event', 'purchase', { value: value, currency: 'ILS' });

    sessionStorage.setItem('purchase_tracked', '1');
  } catch (e) {}
})();
</script>
